<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="petalGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C84A"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5E8B8"/>
      <stop offset="100%" stop-color="#E8C84A"/>
    </linearGradient>
  </defs>
  <!-- Background subtle ink circle -->
  <circle cx="32" cy="32" r="30" fill="#1A1209" opacity="0.04"/>
  <!-- Lotus base (water line) -->
  <path d="M 8 42 Q 32 38 56 42 Q 32 46 8 42 Z" fill="#1A1209" opacity="0.15"/>
  <!-- Outer petals (5 petals, gold) -->
  <g transform="translate(32 42)">
    <!-- Left back petal -->
    <ellipse cx="-18" cy="-6" rx="9" ry="14" transform="rotate(-30 -18 -6)" fill="url(#petalGold)" opacity="0.85"/>
    <!-- Right back petal -->
    <ellipse cx="18" cy="-6" rx="9" ry="14" transform="rotate(30 18 -6)" fill="url(#petalGold)" opacity="0.85"/>
    <!-- Left front petal -->
    <ellipse cx="-11" cy="-10" rx="8" ry="16" transform="rotate(-15 -11 -10)" fill="url(#petalLight)"/>
    <!-- Right front petal -->
    <ellipse cx="11" cy="-10" rx="8" ry="16" transform="rotate(15 11 -10)" fill="url(#petalLight)"/>
    <!-- Center petal -->
    <ellipse cx="0" cy="-14" rx="6.5" ry="17" fill="url(#petalLight)"/>
  </g>
  <!-- Center pistil -->
  <ellipse cx="32" cy="30" rx="3.5" ry="5" fill="#1A1209" opacity="0.8"/>
  <circle cx="32" cy="28" r="1.5" fill="#E8C84A"/>
</svg>
